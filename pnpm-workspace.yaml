packages:
  - "apps/*"
  - "packages/*"
  - "spikes"
overrides:
  # Prisma's config loader pins deepmerge-ts 7 (stack exhaustion on recursive
  # objects, fixed in 8). It only calls `deepmerge`, which 8 keeps unchanged.
  "@prisma/config>deepmerge-ts": ^8.0.2
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  # BullMQ's msgpackr uses this only as an optional native speedup; the pure-JS
  # path works without it. Skip to keep the deps gate green (P6-6).
  msgpackr-extract: false
  prisma: true
  # Next.js optional image-optimization dep; we don't use next/image, so skip
  # its native build. Recording the decision keeps the deps gate green.
  sharp: false
